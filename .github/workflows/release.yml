name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.3). Must already exist if using workflow_dispatch."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────
  # Gate: tests + tag/version validation
  # ─────────────────────────────────────────────────────────
  test:
    name: Test & Validate Tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          install-system-deps: "true"
          cache-key: "release"

      - run: npm ci

      - name: Build runtime
        run: npm run build:runtime

      - name: Test (JS + Rust)
        run: npm run test:all

      - name: Assert tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG"
          echo "Package version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            echo "Run 'npm run sync-version' and ensure tag was created from correct commit."
            exit 1
          fi

      - name: Validate version sync (tauri.conf.json + Cargo.toml)
        run: |
          node scripts/release/version.mjs
          if ! git diff --quiet -- src-tauri/tauri.conf.json src-tauri/Cargo.toml; then
            echo "::error::Version files out of sync after sync-version"
            git diff
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # Build Windows artifacts (x86_64 + aarch64)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build (Windows ${{ matrix.arch }})
    needs: test
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
            target: ""
          - runner: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install-rust: "true"
          rust-targets: ${{ matrix.target }}
          install-system-deps: "false"
          cache-key: ${{ matrix.arch }}

      - run: npm ci

      - name: Sync version
        run: npm run sync-version

      - name: Build runtime
        run: npm run build:runtime

      - name: Verify secrets present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHAPE_CLOUD_BUILD_SECRET: ${{ secrets.SHAPE_CLOUD_BUILD_SECRET }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY missing"; exit 1; fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD missing"; exit 1; fi
          if [ -z "${SHAPE_CLOUD_BUILD_SECRET:-}" ]; then echo "::error::SHAPE_CLOUD_BUILD_SECRET missing"; exit 1; fi
          echo "✓ All required secrets present"

      # Password-protected key in secrets (upload via node/fs, not PowerShell pipe —
      # UTF-16 piping corrupts the key and surfaces as "Wrong password").
      - name: Build Tauri (NSIS only)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHAPE_CLOUD_BUILD_SECRET: ${{ secrets.SHAPE_CLOUD_BUILD_SECRET }}
          NEXT_PUBLIC_SHAPE_WEBSITE_URL: https://www.useshape.org
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri -- build --bundles nsis --target "${{ matrix.target }}"
          else
            npm run tauri -- build --bundles nsis
          fi

      - name: Prepare release assets
        run: node scripts/release/assets.mjs --arch ${{ matrix.arch }} --out-dir dist/release

      - name: List assets
        shell: bash
        run: ls -lh dist/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # Optional: SBOM generation for supply-chain transparency
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: dist/release/
          format: cyclonedx-json
          output-file: dist/release/sbom-${{ matrix.arch }}.cyclonedx.json
        continue-on-error: true

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: dist/release/sbom-${{ matrix.arch }}.cyclonedx.json
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────
  # Publish GitHub Release
  # ─────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lhR dist/release

      - name: Previous tag
        id: prev
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV"

      - name: Detect prerelease
        id: meta
        run: |
          # Stable tags are vX.Y.Z. Nightly tags are hyphenated (vX.Y.Z-nightly) and publish as GitHub prereleases.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease detected: ${GITHUB_REF_NAME}"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release: ${GITHUB_REF_NAME}"
          fi

      - name: Generate release notes
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          # Validate PREV_TAG is a safe git ref (no command substitution, only alphanumeric, dot, dash, slash, underscore)
          if [ -n "${PREV_TAG:-}" ]; then
            if ! echo "$PREV_TAG" | grep -Eq '^[a-zA-Z0-9._/v-]+$'; then
              echo "::error::Invalid previous tag format: $PREV_TAG"
              exit 1
            fi
            # Verify it's a real git ref
            if ! git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
              echo "::warning::Previous tag $PREV_TAG not found as git ref, ignoring"
              PREV_TAG=""
            fi
          fi
          if [ -n "${PREV_TAG:-}" ]; then
            node scripts/release/notes.mjs --from "$PREV_TAG" --to HEAD --output release-notes.md
          else
            node scripts/release/notes.mjs --to HEAD --output release-notes.md
          fi
          cat release-notes.md

      # Build provenance attestation (SLSA) - requires public repo, which Shape is.
      # This gives consumers cryptographic proof of build origin.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/release/*"
        continue-on-error: true

      - name: Publish release (with retries)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--tag "${GITHUB_REF_NAME}" --dir dist/release --notes-file release-notes.md --publish)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          # Draft → upload with retries + octet-stream → publish.
          # Custom script handles intermittent uploads.github.com "Error creating policy".
          node scripts/release/upload.mjs "${ARGS[@]}"

      - name: Summary
        run: |
          {
            echo "## Release ${{ github.ref_name }} published :rocket:"
            echo ""
            echo "Artifacts:"
            find dist/release -type f -exec ls -lh {} \; | awk '{print "- " $9 " (" $5 ")"}' || true
          } >> "$GITHUB_STEP_SUMMARY"

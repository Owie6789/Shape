name: Auto-merge Dependabot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot (patch/minor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Check PR metadata
        id: meta
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "Title: $TITLE"
          # Only auto-merge if it's a patch or minor update (not major)
          # Dependabot titles like "chore(deps): bump X from 1.0.0 to 1.0.1"
          # We allow patch and minor, block major
          if echo "$TITLE" | grep -Eq "from [0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\.[0-9]+\.[0-9]+"; then
            FROM=$(echo "$TITLE" | sed -n 's/.*from \([0-9]*\)\.\([0-9]*\)\.\([0-9]*\) to.*/\1 \2 \3/p')
            TO=$(echo "$TITLE" | sed -n 's/.*to \([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1 \2 \3/p')
            echo "From: $FROM"
            echo "To: $TO"
            FROM_MAJOR=$(echo "$FROM" | cut -d' ' -f1)
            TO_MAJOR=$(echo "$TO" | cut -d' ' -f1)
            if [ "$FROM_MAJOR" != "$TO_MAJOR" ]; then
              echo "Major version bump detected - requires manual review"
              echo "automerge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Minor/patch bump - eligible for auto-merge"
            echo "automerge=true" >> "$GITHUB_OUTPUT"
          else
            # For grouped updates or unknown format, don't auto-merge
            echo "Unknown version format - requires manual review"
            echo "automerge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI
        id: wait-ci
        if: steps.meta.outputs.automerge == 'true'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          # For pull_request events, github.sha is the test-merge commit where CI reports
          # Use github.sha not head.sha to correctly wait for CI Success
          ref: ${{ github.sha }}
          check-name: "CI Success"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success
          verbose: true

      - name: Verify CI success (fail closed)
        if: steps.meta.outputs.automerge == 'true'
        run: |
          if [ "${{ steps.wait-ci.outputs.conclusion }}" != "success" ]; then
            echo "::error::CI did not succeed (conclusion: ${{ steps.wait-ci.outputs.conclusion }}), not auto-merging"
            exit 1
          fi
          # Verify PR head hasn't changed during wait (prevent TOCTOU)
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "CI succeeded for merge commit ${{ github.sha }}, head is $HEAD_SHA"
          # Ensure we still have a successful check for current head via API
          if ! gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs --jq '.check_runs[] | select(.name=="CI Success") | .conclusion' | grep -q "success"; then
            echo "::warning::CI Success not yet reported on head SHA, but merge commit passed - proceeding with auto-merge which will respect branch protection"
          fi

      - name: Enable auto-merge
        if: steps.meta.outputs.automerge == 'true' && steps.wait-ci.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Only auto-merge if CI is green - fail closed
          if ! gh pr view "$PR" --repo "${{ github.repository }}" --json mergeable --jq '.mergeable' | grep -q "MERGEABLE"; then
            echo "::warning::PR not mergeable, skipping auto-merge"
            exit 0
          fi
          gh pr merge "$PR" --auto --squash --repo "${{ github.repository }}"
